name: Aurora Montréal

on:
  schedule:
    - cron: '13 * 9-30 11 *'
      timezone: America/Toronto
    - cron: '43 16-20 9-30 11 *'
      timezone: America/Toronto
    - cron: '13 * 1-27 12 *'
      timezone: America/Toronto
    - cron: '43 16-20 1-27 12 *'
      timezone: America/Toronto
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose dry-run for live data or test-push for one setup message'
        type: choice
        options: [dry-run, test-push]
        default: dry-run

concurrency:
  group: montreal-aurora
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.AURORA_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: ${{ github.event_name == 'schedule' }}
      - name: Run local tests
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m unittest discover -s tests -v
      - name: Read live feeds without sending
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: python3 -m aurora --state history/events.json
      - name: Send one setup message
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -m aurora --test-push
      - name: Monitor and checkpoint alert history
        if: github.event_name == 'schedule'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 -m aurora --send --state history/events.json --git-state
